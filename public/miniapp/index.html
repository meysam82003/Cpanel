<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0c8576">
  <title>Telegram cPanel Manager</title>
  <link rel="stylesheet" href="/miniapp/styles.css">
  <link rel="stylesheet" href="/miniapp/deployment.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="app-header">
      <div class="brand" aria-label="Telegram cPanel Manager"><span class="brand-mark">C</span><span id="page-title">cPanel</span></div>
      <div class="header-actions">
        <label class="host-picker"><span id="host-label">Host</span><select id="host-select" aria-label="Active host"></select></label>
        <button id="context-help" class="icon-button" type="button" aria-label="Help">?</button>
      </div>
    </header>
    <main id="content" tabindex="-1">
      <section class="boot-card" aria-live="polite">
        <div class="loader" aria-hidden="true"></div>
        <h1>در حال اتصال امن…</h1>
        <p>Securely connecting to Telegram…</p>
      </section>
    </main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation"></nav>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" class="sheet"><form id="dialog-form" method="dialog"><header><h2 id="dialog-title"></h2><button class="icon-button" value="cancel" aria-label="Close" type="button" data-dialog-close>×</button></header><div id="dialog-body" class="sheet-body"></div><footer id="dialog-actions"></footer></form></dialog>
  <script type="module" src="/miniapp/app.js"></script>
</body>
</html>
